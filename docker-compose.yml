version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: eduvise_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: eduvise
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: eduvise_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always
    
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eduvise_api
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_SERVER=db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=eduvise
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    restart: always

volumes:
  postgres_data:
  redis_data:
