events {
    worker_connections 1024;
}

http {
    # CORS işlemleri FastAPI (Backend) servisleri tarafından yönetilecektir.
    # Nginx'te header eklemiyoruz ki "multiple values" hatası oluşmasın.

    server {
        listen 8000;

        location /auth/ {
            proxy_pass http://auth-service:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /courses/ {
            proxy_pass http://course-service:8000;
            proxy_set_header Host $host;
        }

        location /knowledge-nodes/ {
            proxy_pass http://course-service:8000;
            proxy_set_header Host $host;
        }

        location /prerequisites/ {
            proxy_pass http://course-service:8000;
            proxy_set_header Host $host;
        }

        location /diagnostic/ {
            proxy_pass http://course-service:8000;
            proxy_set_header Host $host;
        }

        location /roadmap/ {
            proxy_pass http://course-service:8000;
            proxy_set_header Host $host;
        }

        location /ai/ {
            proxy_pass http://ai-service:8000;
            proxy_set_header Host $host;
        }

        location /analytics/ {
            proxy_pass http://analytics-service:8000;
            proxy_set_header Host $host;
        }

        location /ws/ {
            proxy_pass http://analytics-service:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
        }
    }
}
